version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 .
            docker tag $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 $DOCKER_USERNAME/circleci-docker-app:latest
      - run:
          name: Save Docker Image
          command: |
            mkdir -p /tmp/workspace
            docker save $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 -o /tmp/workspace/image.tar
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - image.tar

  test:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker
      - run:
          name: Load Docker Image
          command: docker load -i /tmp/workspace/image.tar
      - run:
          name: Run Container
          command: |
            docker run -d --name test-container -p 5000:5000 $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1
            sleep 5
      - run:
          name: Health Check
          command: |
            RESPONSE=$(docker exec test-container curl -s http://localhost:5000/health)
            echo "Response: $RESPONSE"
            STATUS=$(echo $RESPONSE | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            if [ "$STATUS" = "healthy" ]; then
              echo "Health check passed!"
              exit 0
            else
              echo "Health check failed!"
              exit 1
            fi

  push:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker
      - run:
          name: Load Docker Image
          command: docker load -i /tmp/workspace/image.tar
      - run:
          name: Push to Docker Hub
          command: |
            echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
            docker push $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1
            docker tag $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 $DOCKER_USERNAME/circleci-docker-app:latest
            docker push $DOCKER_USERNAME/circleci-docker-app:latest

workflows:
  build-test-push:
    jobs:
      - build
      - test:
          requires:
            - build
      - push:
          requires:
            - test
          filters:
            branches:
              only: main
