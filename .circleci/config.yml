version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-cache-v1-{{ checksum "app/requirements.txt" }}
            - pip-cache-v1-
      - run:
          name: Install Dependencies
          command: |
            pip install -r app/requirements.txt
      - save_cache:
          key: pip-cache-v1-{{ checksum "app/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 .
            docker tag $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 $DOCKER_USERNAME/circleci-docker-app:latest
      - run:
          name: Save Docker Image
          command: |
            mkdir -p /tmp/workspace
            docker save $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 -o /tmp/workspace/image.tar
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - image.tar

  test:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Load Docker Image
          command: docker load -i /tmp/workspace/image.tar
      - run:
          name: Run Container
          command: |
            docker run -d --name test-container -p 5000:5000 $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1
            sleep 5
      - run:
          name: Health Check
          command: |
            RESPONSE=$(docker exec test-container curl -s http://localhost:5000/health)
            echo "Response: $RESPONSE"
            STATUS=$(echo $RESPONSE | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            if [ "$STATUS" = "healthy" ]; then
              echo "Health check passed!"
              exit 0
            else
              echo "Health check failed!"
              exit 1
            fi

  validate:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Load Docker Image
          command: docker load -i /tmp/workspace/image.tar
      - run:
          name: Start Container
          command: |
            docker run -d --name validate-container -p 5000:5000 $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1
            sleep 5
      - run:
          name: Retry Health Check
          command: |
            MAX_ATTEMPTS=10
            DELAY=5
            ATTEMPT=1
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
              RESPONSE=$(docker exec validate-container curl -s http://localhost:5000/health || echo '{}')
              echo "Response: $RESPONSE"
              STATUS=$(echo $RESPONSE | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              if [ "$STATUS" = "healthy" ]; then
                echo "Validation passed!"
                exit 0
              fi
              echo "Not healthy yet. Waiting $DELAY seconds..."
              sleep $DELAY
              ATTEMPT=$((ATTEMPT + 1))
            done
            echo "Validation failed after $MAX_ATTEMPTS attempts!"
            exit 1

  push:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Load Docker Image
          command: docker load -i /tmp/workspace/image.tar
      - run:
          name: Push to Docker Hub
          command: |
            echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
            docker push $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1
            docker tag $DOCKER_USERNAME/circleci-docker-app:$CIRCLE_SHA1 $DOCKER_USERNAME/circleci-docker-app:latest
            docker push $DOCKER_USERNAME/circleci-docker-app:latest

workflows:
  build-test-push:
    jobs:
      - build
      - test:
          requires:
            - build
      - validate:
          requires:
            - test
      - push:
          requires:
            - validate
          filters:
            branches:
              only: main
